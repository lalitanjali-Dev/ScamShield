<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ScamShield - Forgot Password</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="login.css">

</head>


<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <a href="../index.html" class="logo">
            🛡️ Scam<span>Shield</span>
        </a>

        <a href="login.html" class="back-home">
            ← Back to Login
        </a>

    </header>


    <!-- FORGOT PASSWORD -->

    <main class="login-container">

        <section class="login-card">


            <!-- ICON -->

            <div class="login-icon">
                🔐
            </div>


            <!-- HEADING -->

            <div class="login-heading">

                <span class="small-title">
                    RESET PASSWORD
                </span>

                <h1>
                    Forgot your <strong>Password?</strong>
                </h1>

                <p>
                    Enter your registered email address and
                    we'll send you a password reset link.
                </p>

            </div>


            <!-- ERROR -->

            <div
                id="resetError"
                class="login-error hidden"
            >
            </div>


            <!-- FORM -->

            <form id="resetForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your registered email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-submit"
                >
                    📧 Send Reset Link
                </button>

            </form>


            <!-- BACK TO LOGIN -->

            <div class="signup-text">

                Remember your password?

                <a href="login.html">
                    Login
                </a>

            </div>


            <!-- SECURITY NOTE -->

            <div class="security-note">

                🛡️ Never share your password or reset link
                with anyone.

            </div>


        </section>

    </main>


    <!-- JS -->

    <script
        type="module"
        src="forgot-password.js"
    ></script>

</body>

</html>
