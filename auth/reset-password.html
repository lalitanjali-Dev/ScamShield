<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ScamShield - Reset Password</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <a href="../index.html" class="logo">
            🛡️ Scam<span>Shield</span>
        </a>

        <a href="login.html" class="back-home">
            ← Back to Login
        </a>

    </header>


    <!-- ================= RESET PASSWORD ================= -->

    <main class="login-container">

        <section class="login-card">


            <!-- ICON -->

            <div class="login-icon">
                🔐
            </div>


            <!-- HEADING -->

            <div class="login-heading">

                <span class="small-title">
                    RESET PASSWORD
                </span>

                <h1>
                    Create a New <strong>Password</strong>
                </h1>

                <p>
                    Enter a new password for your
                    ScamShield account.
                </p>

            </div>


            <!-- ================= ERROR ================= -->

            <div
                id="resetError"
                class="login-error hidden"
            >
            </div>


            <!-- ================= RESET FORM ================= -->

            <form id="resetPasswordForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Account
                    </label>

                    <div
                        id="accountEmail"
                        class="account-email"
                    >
                        Checking account...
                    </div>

                </div>


                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="toggleNewPassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            <i class="fa-solid fa-eye-slash"></i>
                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            <i class="fa-solid fa-eye-slash"></i>
                        </button>

                    </div>

                </div>


                <!-- RESET BUTTON -->

                <button
                    type="submit"
                    class="login-submit"
                    id="resetButton"
                >
                    🔒 Reset Password
                </button>


            </form>


            <!-- ================= SUCCESS ================= -->

            <div
                id="resetSuccess"
                class="reset-success hidden"
            >

                <span class="success-icon">
                    ✓
                </span>

                <div>

                    <strong>
                        Password Reset Successful
                    </strong>

                    <p>
                        Your ScamShield password has
                        been updated successfully.
                    </p>

                </div>

            </div>


            <!-- ================= SECURITY NOTE ================= -->

            <div class="security-note">

                🛡️ Keep your ScamShield password
                private and secure.

            </div>


        </section>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script
        type="module"
        src="reset-password.js"
    ></script>

</body>

</html>
