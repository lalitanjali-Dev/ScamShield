<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ScamShield - Create Account</title>

    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <a href="../index.html" class="logo">
            🛡️ Scam<span>Shield</span>
        </a>

        <a href="../index.html" class="back-home">
            ← Back to Home
        </a>

    </header>


    <!-- SIGNUP AREA -->

    <main class="signup-container">

        <section class="signup-card">

            <!-- ICON -->

            <div class="signup-icon">
                🛡️
            </div>


            <!-- HEADING -->

            <div class="signup-heading">

                <span class="small-title">
                    GET STARTED
                </span>

                <h1>
                    Create your <strong>ScamShield</strong> Account
                </h1>

                <p>
                    Create an account to start protecting yourself
                    from online scams.
                </p>

            </div>


            <!-- SIGNUP FORM -->

            <form id="signupForm">

                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        required
                    >

                </div>


                <!-- TERMS -->

                <div class="checkbox-group">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the ScamShield terms and
                        understand that I should never share my
                        password or OTP.
                    </label>

                </div>


                <!-- CREATE ACCOUNT BUTTON -->

                <button
                    type="submit"
                    class="signup-submit"
                >
                    🛡️ Create Account
                </button>

            </form>


            <!-- LOGIN LINK -->

            <div class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>


            <!-- SECURITY NOTICE -->

            <div class="security-note">

                🔒 Your account information is stored securely
                for this prototype.

            </div>

        </section>

    </main>


    <script type="module" src="signup.js"></script>

</body>

</html>
